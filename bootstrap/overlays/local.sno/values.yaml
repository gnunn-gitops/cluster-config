default:
  app:
    enabled: true
    enableAutoSync: true
    autoSyncPrune: false
    project: cluster-config
    labels:
      app-source: local.sno
      repo: cluster-config
    destination:
      namespace: openshift-gitops
      server: https://kubernetes.default.svc
    source:
      repoURL: https://github.com/codieman/cluster-config.git
      targetRevision: HEAD

projects:

  cluster-config:
    description: Project for overall cluster configuration
    namespace: openshift-gitops
    sourceRepos:
    - https://github.com/codieman/cluster-config
    - https://github.com/codieman/cluster-config.git
    destinations: |
      - namespace: '*'
        server: https://kubernetes.default.svc
    extraFields: |
      clusterResourceWhitelist:
      - group: '*'
        kind: '*'

applications:

  lvm-operator:
    annotations:
      argocd.argoproj.io/sync-wave: '1'
    destination:
      namespace: openshift-storage
    source:
      path: components/lvm-operator/base

  cert-manager:
    annotations:
      argocd.argoproj.io/sync-wave: '1'
    destination:
      namespace: cert-manager-operator
    source:
      path: components/cert-manager-operator/aggregate/overlays/letsencrypt

  certificates:
    annotations:
      argocd.argoproj.io/sync-wave: '2'
    source:
      path: components/certificates/base
