apiVersion: config.openshift.io/v1
kind: APIServer
metadata:
  name: cluster
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: Validate=false,ServerSideApply=true,Delete=false
spec:
  servingCerts:
    namedCertificates:
    - names:
      - api.ocplocal.techilm.net
      servingCertificate:
        name: api-custom-domain-cert
