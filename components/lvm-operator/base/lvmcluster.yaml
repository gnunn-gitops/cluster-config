apiVersion: lvm.topolvm.io/v1alpha1
kind: LVMCluster
metadata:
  name: local-lvmcluster
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true,Delete=false
spec:
  storage:
    deviceClasses:
      - name: vg1
        default: true
        fstype: xfs
        thinPoolConfig:
          name: thin-pool-1
          overprovisionRatio: 10
          sizePercent: 90
